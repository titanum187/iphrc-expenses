<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مصروفات الهيئة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0D2621;
    --paper:#F5FAF8;
    --panel:#FFFFFF;
    --teal:#06755C;
    --teal-2:#045847;
    --gold:#0E9077;
    --gold-soft:#DEF1EA;
    --line:#D6E7E1;
    --ok:#06755C;
    --ok-bg:#E1F2EC;
    --bad:#AD3B2C;
    --bad-bg:#FBEAE5;
    --muted:#5C7069;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Thmanyah Sans','Cairo',sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    border-top:4px solid var(--teal);
  }
  .num{font-family:'IBM Plex Mono','Thmanyah Sans','Cairo',monospace;font-weight:600;text-align:center !important;direction:ltr;unicode-bidi:plaintext;}
  #app{max-width:1180px;margin:0 auto;padding:22px 22px 60px;}

  /* ---------- Header ---------- */
  .masthead{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:3px solid var(--teal);
    padding-bottom:14px;margin-bottom:18px;flex-wrap:wrap;gap:10px;
  }
  .masthead .brand{display:flex;align-items:center;gap:12px;}
  .masthead .brand img{
    width:56px;height:56px;flex:none;
  }
  .masthead h1{
    margin:0;font-size:23px;font-weight:800;color:var(--teal);letter-spacing:.2px;line-height:1.35;
  }
  .masthead .org-name{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:2px;}
  .masthead .sub{margin-top:4px;color:var(--muted);font-size:14px;}
  .masthead .actions{display:flex;gap:8px;flex-wrap:wrap;}

  button{
    font-family:inherit;cursor:pointer;border:1px solid var(--teal);
    background:var(--panel);color:var(--teal);border-radius:7px;
    padding:8px 14px;font-size:14px;font-weight:600;transition:.15s;
  }
  button:hover{background:var(--teal);color:#fff;}
  button.primary{background:var(--teal);color:#fff;}
  button.primary:hover{background:var(--teal-2);}
  button.ghost{border-color:var(--line);color:var(--muted);}
  button.ghost:hover{background:var(--ink);color:#fff;border-color:var(--ink);}
  button.danger{border-color:var(--bad);color:var(--bad);}
  button.danger:hover{background:var(--bad);color:#fff;}
  button.sm{padding:4px 9px;font-size:12px;border-radius:5px;}

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex;gap:4px;flex-wrap:wrap;margin-bottom:18px;
    border-bottom:1px solid var(--line);
  }
  .tab{
    padding:9px 16px;font-size:14.5px;font-weight:600;color:var(--muted);
    cursor:pointer;border-bottom:3px solid transparent;user-select:none;
    white-space:nowrap;
  }
  .tab:hover{color:var(--teal);}
  .tab.active{color:var(--teal);border-bottom-color:var(--gold);}

  .year-switcher{display:flex;align-items:center;gap:6px;margin-bottom:10px;}
  .year-pill{
    padding:5px 14px;border-radius:20px;font-size:12.5px;font-weight:700;
    border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;
  }
  .year-pill.active{background:var(--teal);color:#fff;border-color:var(--teal);}
  .year-pill.add{border-style:dashed;color:var(--teal);}
  .tab .dot{
    display:inline-block;width:6px;height:6px;border-radius:50%;
    background:var(--gold);margin-inline-start:6px;vertical-align:middle;
  }

  /* ---------- Cards / layout ---------- */
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
  .grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start;}
  @media(max-width:820px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;}}

  .stat{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:14px 16px 14px 16px;border-inline-start:4px solid var(--teal);
  }
  .stat .label{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:6px;}
  .stat .value{font-size:21px;font-weight:700;color:var(--teal);}
  .stat.gold{border-inline-start-color:var(--gold);}
  .stat.gold .value{color:var(--gold);}
  .stat.ok{border-inline-start-color:var(--ok);}
  .stat.bad{border-inline-start-color:var(--bad);}
  .stat.ok .value{color:var(--ok);}
  .stat.bad .value{color:var(--bad);}

  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:16px 18px;margin-bottom:18px;border-top:3px solid var(--teal);
    box-shadow:0 1px 3px rgba(13,38,33,.06), 0 1px 2px rgba(13,38,33,.04);
  }
  .panel h2{margin:0 0 12px;font-size:16px;color:var(--teal);font-weight:700;
    display:flex;justify-content:space-between;align-items:center;}
  .panel h2 .hint{font-size:11.5px;color:var(--muted);font-weight:500;}

  /* ---------- Table ---------- */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  .table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;}

  /* ---------- Responsive card view for the entries table on narrow screens ----------
     بدل الاعتماد على شريط تمرير أفقي (يختلف سلوكه حسب المتصفح وحجم الخط الفعلي
     على كل جهاز)، يتحول جدول العمليات إلى بطاقات مكدَّسة رأسيًا على الشاشات
     الضيقة — فلا حاجة لأي تمرير أفقي إطلاقًا مهما كان عرض الشاشة. */
  @media (max-width: 900px){
    .table-scroll{overflow-x:visible;border:none;border-radius:0;}
    .table-scroll table{border:none;display:block;width:100%;}
    #rowsBody, #rowsBody tr, #rowsBody td{display:block;width:100%;}
    .table-scroll thead{display:none;}
    #rowsBody tr{
      border:1px solid var(--line);border-radius:10px;margin-bottom:12px;
      padding:8px 12px;background:var(--panel);box-shadow:0 1px 3px rgba(13,38,33,.06);
    }
    #rowsBody td{
      display:flex;justify-content:space-between;align-items:center;gap:10px;
      padding:7px 2px;border-bottom:1px dashed #E3EFEA;text-align:end;
    }
    #rowsBody td:last-child{border-bottom:none;}
    #rowsBody td::before{
      content:attr(data-label);font-weight:700;color:var(--muted);font-size:11.5px;
      flex:none;text-align:start;
    }
    #rowsBody td[data-label=""]::before{display:none;}
    #rowsBody td[data-label=""]{justify-content:flex-end;}
    #rowsBody td .cell-input, #rowsBody td select, #rowsBody td textarea{width:auto;max-width:62%;text-align:end;}
    #rowsBody td textarea.cell-input{max-width:100%;width:100%;text-align:start;margin-top:4px;}
    tfoot{display:block;width:100%;}
    tfoot tr{display:flex;justify-content:space-between;padding:4px 2px;}
    tfoot td{display:block;border:none !important;}
    tfoot td:empty{display:none;}

    /* نفس فكرة البطاقات لجداول الملخصات الأصغر (الموظفين والتصنيفات) */
    .emp-table, .emp-table thead, .emp-table tbody, .emp-table tr, .emp-table th, .emp-table td{display:block;width:100%;}
    .emp-table thead{display:none;}
    .emp-table tbody tr{
      border:1px solid var(--line);border-radius:10px;margin-bottom:10px;
      padding:8px 12px;background:var(--panel);box-shadow:0 1px 3px rgba(13,38,33,.06);
    }
    .emp-table tbody td{
      display:flex;justify-content:space-between;align-items:center;gap:10px;
      padding:6px 2px;border-bottom:1px dashed #E3EFEA;text-align:end;
    }
    .emp-table tbody td:last-child{border-bottom:none;}
    .emp-table tbody td::before{
      content:attr(data-label);font-weight:700;color:var(--muted);font-size:11.5px;
      flex:none;text-align:start;
    }
    .emp-table tbody td input.cell-input{width:auto;max-width:55%;}
  }
  thead th{
    text-align:center;font-size:11.5px;color:var(--teal-2);font-weight:800;
    padding:10px 8px;border-bottom:2px solid var(--teal);white-space:nowrap;
    background:var(--gold-soft);letter-spacing:.2px;
  }
  thead th:first-child{border-start-start-radius:6px;}
  thead th:last-child{border-start-end-radius:6px;}
  thead th.num{text-align:center !important;}
  tbody td{padding:8px 8px;border-bottom:1px solid #E3EFEA;vertical-align:middle;text-align:center;}
  tbody tr:nth-child(even) td{background:var(--paper);}
  tbody tr:hover td{background:#E4F1EA;}
  tbody tr.example td{color:var(--muted);font-style:italic;}
  tfoot td{padding:10px 8px;font-weight:800;border-top:2px solid var(--teal);background:var(--gold-soft);}
  tfoot td:first-child{border-end-start-radius:6px;}
  tfoot td:last-child{border-end-end-radius:6px;}

  .cell-input{
    width:100%;border:1px solid transparent;background:transparent;
    font-family:inherit;font-size:13.5px;padding:5px 6px;border-radius:5px;color:var(--ink);
    text-overflow:ellipsis;text-align:center;
  }
  .cell-input:hover{border-color:var(--line);}
  .cell-input:focus{outline:none;border-color:var(--gold);background:#fff;text-overflow:clip;}
  select.cell-input{cursor:pointer;text-align-last:center;}
  input[type=number].cell-input{font-family:'IBM Plex Mono';text-align:center;direction:ltr;}
  input[type=date].cell-input{text-align:center;}
  input[type=text].cell-input{min-width:70px;}
  textarea.cell-input{
    resize:none;overflow:hidden;white-space:pre-wrap;word-break:break-word;
    line-height:1.4;min-height:30px;min-width:110px;font-family:inherit;display:block;
    font-size:12.5px;
  }

  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;border:none;cursor:pointer;font-family:inherit;white-space:nowrap;}
  .badge.paid{background:var(--ok-bg);color:var(--ok);}
  .badge.unpaid{background:var(--bad-bg);color:var(--bad);}

  .row-actions{display:flex;gap:4px;}
  .icon-btn{
    border:none;background:transparent;color:var(--muted);cursor:pointer;
    font-size:15px;padding:2px 6px;border-radius:5px;
  }
  .icon-btn:hover{background:var(--bad-bg);color:var(--bad);}

  .col-amount{width:90px;}
  .col-date{width:118px;}
  .col-status{width:96px;white-space:nowrap;}
  .col-num{width:34px;text-align:center;color:var(--muted);}
  .col-receipt{width:64px;text-align:center;}

  /* ---------- Receipt attach / scan ---------- */
  .receipt-btn{
    width:36px;height:36px;border-radius:7px;border:1px dashed var(--line);
    background:#F1F8F5;display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:15px;color:var(--muted);padding:0;margin:0 auto;overflow:hidden;
  }
  .receipt-btn:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-soft);}
  .receipt-btn.has-file{border:1px solid var(--teal);background:#fff;}
  .receipt-btn img{width:100%;height:100%;object-fit:cover;}
  .receipt-btn.loading{opacity:.5;pointer-events:none;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(19,37,35,.72);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal-overlay.top{z-index:80;}
  .modal-box{
    background:#fff;border-radius:12px;max-width:520px;width:100%;max-height:88vh;
    display:flex;flex-direction:column;overflow:hidden;
  }
  .modal-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 16px;border-bottom:1px solid var(--line);
  }
  .modal-head strong{color:var(--teal);font-size:14px;}
  .modal-body{padding:14px 16px;overflow:auto;text-align:center;background:#EEF6F2;}
  .modal-body img{max-width:100%;max-height:60vh;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.15);}
  .modal-foot{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);justify-content:flex-end;}

  .add-row-bar{padding:10px 4px 2px;}

  /* employee summary mini table */
  .emp-table td, .emp-table th{padding:7px 8px;}
  .emp-table th{font-size:12px;}
  .diff-pos{color:var(--ok);font-weight:700;}
  .diff-neg{color:var(--bad);font-weight:700;}

  .empty-note{
    text-align:center;color:var(--muted);padding:30px 10px;font-size:13.5px;
    border:1px dashed var(--line);border-radius:8px;
  }

  .footer-note{
    margin-top:26px;padding-top:14px;border-top:1px solid var(--line);
    color:var(--muted);font-size:12px;line-height:1.9;
  }
  .legend-dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-inline-end:5px;vertical-align:middle;}

  .loading{padding:80px 0;text-align:center;color:var(--muted);font-size:14px;}

  .month-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .month-card{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:14px;cursor:pointer;transition:.15s;
  }
  .month-card:hover{border-color:var(--gold);transform:translateY(-1px);}
  .month-card .m-name{font-weight:700;color:var(--teal);font-size:14px;margin-bottom:8px;}
  .month-card .m-total{font-size:18px;font-weight:700;}
  .month-card .m-count{font-size:12.5px;color:var(--muted);margin-top:4px;}
  .m-bar-track{height:5px;background:var(--paper);border-radius:3px;margin-top:8px;overflow:hidden;}
  .m-bar-fill{height:100%;background:var(--teal);border-radius:3px;transition:width .3s;}
  @media(max-width:820px){.month-grid{grid-template-columns:repeat(2,1fr);}}

  .save-flag{
    position:fixed;bottom:16px;left:16px;background:var(--teal);color:#fff;
    padding:7px 14px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .3s;
    pointer-events:none;
  }
  .save-flag.show{opacity:.92;}
  .save-flag.save-flag-error{background:var(--bad);}

  .storage-banner{
    background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad);
    border-radius:8px;padding:9px 14px;font-size:12.5px;margin-bottom:14px;
    display:flex;align-items:center;gap:8px;
  }
  .storage-banner.info{
    background:var(--gold-soft);color:var(--teal-2);border-color:var(--gold);
  }

  /* ---------- Auth screens ---------- */
  .auth-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .auth-card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    width:100%;max-width:380px;padding:28px 26px 24px;
    box-shadow:0 10px 34px rgba(14,59,54,.10);
  }
  .auth-card .auth-logo{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:18px;}
  .auth-card .auth-logo img{width:66px;height:66px;margin-bottom:10px;}
  .auth-card .auth-logo .org{font-size:12px;color:var(--muted);font-weight:600;line-height:1.6;}
  .auth-card h2{margin:14px 0 4px;font-size:17px;color:var(--teal);text-align:center;}
  .auth-card .auth-hint{font-size:12px;color:var(--muted);text-align:center;margin-bottom:16px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;}
  .field input, .field select{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;
    font-family:inherit;font-size:13.5px;background:#F1F8F5;color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--gold);background:#fff;}
  .auth-card button.full{width:100%;padding:10px;font-size:14px;margin-top:4px;}
  .auth-error{
    background:var(--bad-bg);color:var(--bad);border-radius:7px;padding:8px 10px;
    font-size:12.5px;margin-bottom:12px;
  }
  .auth-switch{text-align:center;font-size:12.5px;color:var(--muted);margin-top:14px;}
  .auth-switch a{color:var(--teal);font-weight:700;cursor:pointer;text-decoration:none;}
  .security-note{
    margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);
    font-size:11px;color:var(--muted);line-height:1.7;
  }

  /* ---------- Account bar ---------- */
  .account-chip{
    display:flex;align-items:center;gap:8px;border:1px solid var(--line);
    border-radius:20px;padding:5px 6px 5px 12px;background:#fff;font-size:12.5px;cursor:pointer;
  }
  .account-chip:hover{border-color:var(--gold);}
  .account-chip .avatar{
    width:26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;
  }
  .role-pill{
    display:inline-block;padding:1px 8px;border-radius:10px;font-size:10.5px;font-weight:700;
    margin-inline-start:5px;
  }
  .role-pill.admin{background:var(--teal);color:#fff;}
  .role-pill.member{background:var(--gold-soft);color:var(--teal-2);}

  .account-menu{
    position:absolute;left:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);
    border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);min-width:190px;z-index:40;overflow:hidden;
  }
  .account-menu button{
    display:block;width:100%;text-align:right;border:none;border-radius:0;padding:10px 14px;
    background:#fff;font-size:13px;
  }
  .account-menu button:hover{background:var(--paper);color:var(--teal);}
  .account-wrap{position:relative;}

  .users-table td, .users-table th{padding:8px;}
  .users-table select{padding:5px 8px;font-size:13.5px;border-radius:6px;border:1px solid var(--line);}
  .inline-form{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:8px;align-items:end;margin-top:12px;}
  @media(max-width:760px){.inline-form{grid-template-columns:1fr 1fr;}}
  /* ---------- Print report (PDF export) ----------
     ملاحظة: محتوى التقرير الفعلي يُبنى ويُنسَّق بالكامل داخل تبويب
     منفصل يفتحه exportMonthPdf() (بأنماط CSS خاصة به)، وليس ضمن هذه
     الصفحة، لتفادي حجب window.print() داخل إطار المعاينة المعزول. */
</style>
</head>
<body>
<div id="app"><div class="loading">جارِ التحقق من الجلسة…</div></div>
<div class="save-flag" id="saveFlag">تم الحفظ</div>
<div id="modalRoot"></div>
<div id="dialogRoot"></div>

/* =========================================================
   نظام تسجيل الدخول والصلاحيات
   ملاحظة أمنية: هذا نظام دخول خفيف مبني بالكامل داخل المتصفح
   (لا يوجد خادم خلفي). كلمات المرور تُخزَّن كبصمة SHA-256 وليست
   نصًا صريحًا، لكن أي شخص يملك رابط هذا التطبيق يشارك نفس قاعدة
   الحسابات والبيانات. مناسب لتنظيم العمل داخل فريق موثوق، وليس
   بديلاً عن نظام دخول مؤسسي حقيقي لبيانات حساسة جدًا.
   ========================================================= */
const USERS_KEY = 'iphrc-users-accounts';
let currentUser = null; // {username, displayName, role}

// تجزئة كلمة المرور بدون الاعتماد على Web Crypto API (crypto.subtle)، لأنها
// قد تكون غير متاحة داخل إطار المعاينة المعزول لبعض المتصفحات - ما كان
// يسبب فشلاً صامتاً عند إنشاء الحساب أو تسجيل الدخول. هذه دالة تجزئة
// حتمية (deterministic) تعمل من دون أي متطلبات خاصة بالمتصفح أو الشبكة.
function hashPass(pw){
  const str = 'iphrc-expenses-2026::' + String(pw);
  let h1 = 0xdeadbeef ^ str.length, h2 = 0x41c6ce57 ^ str.length;
  for (let i = 0; i < str.length; i++){
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h1 >>> 0).toString(16).padStart(8,'0') + (h2 >>> 0).toString(16).padStart(8,'0');
}

/* ---------------------------------------------------------------
   حساب مدير مدمج (احتياطي) دائم التوفّر
   في بعض بيئات المعاينة قد لا يعمل التخزين المشترك (window.storage)
   إطلاقًا، فيتعذّر إنشاء أي حساب أول عبر الشاشة. لذلك يوجد دومًا حساب
   مدير مدمج في الكود نفسه يمكن الدخول به دائمًا، بصرف النظر عن حالة
   التخزين. يمكن تغيير كلمة مروره لاحقًا من "تغيير كلمة المرور" إن كان
   التخزين يعمل، أو تجاهله واستخدام "إدارة المستخدمين" لإضافة حسابات
   حقيقية بمجرد الدخول.
   بيانات الدخول الافتراضية: admin / iphrc2026
   --------------------------------------------------------------- */
const BUILTIN_ADMIN_USERNAME = 'admin';
const BUILTIN_ADMIN_PASSWORD = 'iphrc2026';
function builtinAdmin(){
  return {username: BUILTIN_ADMIN_USERNAME, displayName: 'المدير', role: 'admin', passHash: hashPass(BUILTIN_ADMIN_PASSWORD)};
}

let usersCache = null;   // نسخة العمل الحالية (تُستخدم فورًا حتى لو تعذّر الحفظ)
let storageOk = true;    // هل التخزين المشترك يعمل فعليًا في هذه الجلسة؟

async function loadUsers(force){
  if(usersCache && !force) return usersCache;
  let stored = [];
  try{
    const raw = await StorageAdapter.get(USERS_KEY);
    if(raw) stored = JSON.parse(raw);
  }catch(e){ stored = []; }
  if(!stored.some(u=>u.username===BUILTIN_ADMIN_USERNAME)){
    stored = [builtinAdmin(), ...stored];
  }
  usersCache = stored;
  return stored;
}

// يحدّث النسخة الحالية فورًا (حتى تعمل الجلسة بشكل طبيعي)، ثم يحاول
// الحفظ بشكل دائم عبر طبقة التخزين (جسر Claude أو التخزين المحلي).
async function persistUsers(users){
  usersCache = users;
  try{
    const saved = await StorageAdapter.set(USERS_KEY, JSON.stringify(users));
    storageOk = !!saved;
    return storageOk;
  }catch(e){
    storageOk = false;
    return false;
  }
}

function isAdmin(){
  return !!(currentUser && currentUser.role === 'admin');
}

function initials(name){
  const parts = String(name||'').trim().split(/\s+/);
  const a = parts[0] ? parts[0][0] : '';
  const b = parts[1] ? parts[1][0] : '';
  return (a+b).toUpperCase() || '؟';
}

/* ---------------- شاشة تسجيل الدخول ---------------- */
function renderLogin(users){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="auth-wrap"><div class="auth-card">
      <div class="auth-logo">
        <img src="data:image/png;base64,${LOGO_B64}" alt="${t('orgName')}">
        <div class="org">${t('orgName')}</div>
      </div>
      <h2>${t('login')}</h2>
      <div class="auth-hint">${t('appSystemName')}</div>
      <div id="loginError"></div>
      <div class="field"><label>${t('username')}</label><input id="liUser" type="text" style="direction:ltr;text-align:left;" autofocus></div>
      <div class="field"><label>${t('password')}</label><input id="liPass" type="password" style="direction:ltr;text-align:left;"></div>
      <button class="primary full" id="liBtn">${t('loginBtn')}</button>
      <button class="ghost full" id="liRefresh" style="margin-top:6px;">${t('refreshAccounts')}</button>
      <div style="text-align:center;margin-top:14px;">
        <button class="ghost sm" id="liLangToggle" style="padding:6px 14px;">${currentLang==='en' ? 'العربية' : 'English'}</button>
      </div>
    </div></div>
  `;
  document.getElementById('liLangToggle').onclick = ()=>{
    setLang(currentLang === 'en' ? 'ar' : 'en');
    renderLogin(users);
  };
  const doLogin = async ()=>{
    const uname = document.getElementById('liUser').value.trim().toLowerCase();
    const pass = document.getElementById('liPass').value;
    const errBox = document.getElementById('loginError');
    errBox.innerHTML = '';
    if(!uname || !pass){ errBox.innerHTML = `<div class="auth-error">${currentLang==='en'?'Enter your username and password.':'أدخل اسم المستخدم وكلمة المرور.'}</div>`; return; }
    const user = users.find(u=>u.username===uname);
    if(!user){ errBox.innerHTML = `<div class="auth-error">${currentLang==='en'?'Username not found. Check spelling (no spaces, lowercase).':'اسم المستخدم غير موجود. تحقق من كتابته (بدون مسافات، حروف صغيرة).'}</div>`; return; }
    const h = hashPass(pass);
    if(h !== user.passHash){ errBox.innerHTML = `<div class="auth-error">${currentLang==='en'?'Incorrect password.':'كلمة المرور غير صحيحة.'}</div>`; return; }
    currentUser = {username: user.username, displayName: user.displayName, role: user.role};
    await startApp();
  };
  document.getElementById('liRefresh').onclick = async ()=>{
    const fresh = await loadUsers(true);
    users = fresh;
    const errBox = document.getElementById('loginError');
    errBox.innerHTML = currentLang==='en'
      ? `<div class="security-note" style="color:var(--ok);">Account list updated (${fresh.length} accounts).</div>`
      : '<div class="security-note" style="color:var(--ok);">تم تحديث قائمة الحسابات (' + fresh.length + ' حساب).</div>';
  };
  document.getElementById('liBtn').onclick = doLogin;
  document.getElementById('liPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  document.getElementById('liUser').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}

function logout(){
  stopAutoSync();
  currentUser = null;
  boot();
}

const StorageAdapter = (function(){
  let mode = 'unknown'; // 'cloud' | 'bridge' | 'local' | 'memory'
  const memoryStore = {};
  const LS_PREFIX = 'iphrc-expenses-2026::';
  const CLOUD_URL_KEY = LS_PREFIX + 'cloud-sync-url';

  // ---------- إعداد رابط المزامنة السحابية (Google Apps Script Web App) ----------
  // يمكن تضمين رابط افتراضي هنا مباشرة (يُستخدم تلقائيًا لجميع من يفتح
  // الملف) بدل الاعتماد على إعداده يدويًا من كل متصفح. اتركه فارغًا إن لم
  // يوجد رابط مضمّن بعد.
  const DEFAULT_CLOUD_URL = 'https://script.google.com/macros/s/AKfycbzUfH4wz6IB1xJXFv66fZ2i0APEsG0Hsa3kSTuTPVq6WX-Td6AZ-r6JIfgVqyzCdXIjlQ/exec';

  function getCloudUrl(){
    try{
      const stored = window.localStorage.getItem(CLOUD_URL_KEY);
      if(stored) return stored;
    }catch(e){}
    return DEFAULT_CLOUD_URL || '';
  }
  function setCloudUrl(url){
    try{ window.localStorage.setItem(CLOUD_URL_KEY, url || ''); }catch(e){}
  }

  function lsAvailable(){
    try{
      const k = LS_PREFIX + '__test__';
      window.localStorage.setItem(k, '1');
      window.localStorage.removeItem(k);
      return true;
    }catch(e){ return false; }
  }

  async function cloudGet(key){
    const base = getCloudUrl();
    if(!base) return {ok:false};
    try{
      const res = await fetch(base + (base.includes('?')?'&':'?') + 'key=' + encodeURIComponent(key) + '&t=' + Date.now());
      if(!res.ok) return {ok:false};
      const data = await res.json();
      if(data && data.error) return {ok:false};
      return {ok:true, value: (data && data.value != null) ? data.value : null};
    }catch(e){ return {ok:false}; }
  }
  async function cloudSet(key, value){
    const base = getCloudUrl();
    if(!base) return false;
    try{
      // نستخدم text/plain لتفادي طلب preflight (CORS) الذي لا تدعمه
      // تطبيقات Google Apps Script المنشورة كويب آب بشكل موثوق دومًا.
      const res = await fetch(base, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify({action:'set', key, value})
      });
      if(!res.ok) return false;
      const data = await res.json();
      return !!(data && data.ok);
    }catch(e){ return false; }
  }
  async function cloudDelete(key){
    const base = getCloudUrl();
    if(!base) return false;
    try{
      const res = await fetch(base, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify({action:'delete', key})
      });
      if(!res.ok) return false;
      const data = await res.json();
      return !!(data && data.ok);
    }catch(e){ return false; }
  }
  async function cloudPing(){
    const base = getCloudUrl();
    if(!base) return false;
    const res = await cloudGet('__ping__');
    return res.ok;
  }

  async function get(key){
    if(getCloudUrl()){
      const c = await cloudGet(key);
      if(c.ok){
        mode = 'cloud';
        if(c.value != null) memoryStore[key] = c.value;
        return c.value;
      }
    }
    try{
      if(window.storage && typeof window.storage.get === 'function'){
        const res = await window.storage.get(key, true);
        if(res && res.value != null){ if(mode!=='cloud') mode = 'bridge'; return res.value; }
      }
    }catch(e){ /* الانتقال للخطة البديلة */ }
    if(lsAvailable()){
      try{
        const raw = window.localStorage.getItem(LS_PREFIX + key);
        if(raw != null){ if(mode==='unknown') mode = 'local'; return raw; }
      }catch(e){}
    }
    if(key in memoryStore){ if(mode==='unknown') mode = 'memory'; return memoryStore[key]; }
    return null;
  }

  async function set(key, value){
    memoryStore[key] = value; // نسخة فورية في الذاكرة دائمًا، بصرف النظر عن نتيجة الحفظ الدائم
    if(getCloudUrl()){
      const cloudOk = await cloudSet(key, value);
      if(cloudOk){ mode = 'cloud'; return true; }
      // لو فشلت السحابة، نكمل بمحاولة الطبقات الأخرى كنسخة احتياطية محلية
    }
    let bridgeOk = false;
    try{
      if(window.storage && typeof window.storage.set === 'function'){
        const res = await window.storage.set(key, value, true);
        bridgeOk = !!res;
      }
    }catch(e){ bridgeOk = false; }
    let localOk = false;
    if(lsAvailable()){
      try{ window.localStorage.setItem(LS_PREFIX + key, value); localOk = true; }catch(e){ localOk = false; }
    }
    if(mode !== 'cloud'){
      mode = bridgeOk ? 'bridge' : (localOk ? 'local' : 'memory');
    }
    return bridgeOk || localOk;
  }

  async function del(key){
    delete memoryStore[key];
    if(getCloudUrl()){ await cloudDelete(key); }
    try{ if(window.storage && typeof window.storage.delete === 'function') await window.storage.delete(key, true); }catch(e){}
    if(lsAvailable()){ try{ window.localStorage.removeItem(LS_PREFIX + key); }catch(e){} }
  }

  async function probe(){
    if(getCloudUrl()){
      const ok = await cloudPing();
      if(ok){ mode = 'cloud'; return mode; }
    }
    try{
      if(window.storage && typeof window.storage.set === 'function'){
        const res = await window.storage.set('__probe__', '1', true);
        if(res){ mode = 'bridge'; return mode; }
      }
    }catch(e){ /* الانتقال للخطة البديلة */ }
    mode = lsAvailable() ? 'local' : 'memory';
    return mode;
  }

  return {get, set, delete: del, getMode: ()=>mode, probe, getCloudUrl, setCloudUrl, cloudPing};
})();

function yearKeysSorted(){

function ensureYearExists(st, year){
  if(!st.years) st.years = {};
  if(!st.years[year]){
    const m = {};
    MONTHS.forEach(mo=> m[mo.key] = {entries:[], advances:{}});
    st.years[year] = { months: m };
  }
  return st.years[year];
}
// نسخة القراءة السريعة: تشير دومًا لأشهر السنة النشطة حاليًا في الواجهة
function yearMonths(){

  return state.years[activeYear].months;
}

let state = null;
let activeTab = 'SUMMARY';
let activeYear = '2026';
let saveTimer = null;

const STATE_KEY = 'expenses-state-2026';

async function loadState(){
  try{
    const raw = await StorageAdapter.get(STATE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      idCounter = parsed.idCounter || 1000;
      lastKnownRev = parsed.rev || 0;
      // ترحيل تلقائي من النسخة القديمة أحادية السنة (months مباشرة على
      // الجذر) إلى بنية years متعددة السنوات، حفاظًا على البيانات القديمة
      if(parsed.months && !parsed.years){
        parsed.years = { '2026': { months: parsed.months } };
        delete parsed.months;
      }
      if(!parsed.years) parsed.years = {};
      // ترحيل: أضِف التصنيفات الافتراضية لأي بيانات قديمة لا تحتوي عليها
      if(!parsed.categories || !parsed.categories.length){
        parsed.categories = DEFAULT_CATEGORIES.map(c=>({...c}));
      }
      const keys = Object.keys(parsed.years).sort();
      activeYear = parsed.lastActiveYear && parsed.years[parsed.lastActiveYear] ? parsed.lastActiveYear : (keys[keys.length-1] || '2026');
      ensureYearExists(parsed, activeYear);
      return parsed;
    }
  }catch(e){ /* لا توجد بيانات محفوظة بعد */ }
  const seeded = seedData();
  activeYear = '2026';
  return seeded;
}

let dataStorageOk = true;

function showSaveFlag(ok){
  const flag = document.getElementById('saveFlag');
  if(!flag) return;
  flag.textContent = ok ? 'تم الحفظ' : 'تعذّر الحفظ — التخزين المشترك لا يعمل';

  flag.classList.add('show');

  saveTimer = setTimeout(()=>flag.classList.remove('show'), ok ? 900 : 3500);
}

let lastKnownRev = 0; // آخر إصدار من البيانات رأيناه (محليًا أو من التحديث التلقائي)

function persist(){
  state.idCounter = idCounter;
  state.rev = (state.rev || 0) + 1;
  state.updatedAt = Date.now();
  lastKnownRev = state.rev;
  // StorageAdapter نفسها لا ترمي أخطاء متزامنة (تتعامل داخليًا مع أي فشل
  // في جسر Claude أو localStorage)، لكن نُبقي الحماية هنا احتياطًا.
  try{
    StorageAdapter.set(STATE_KEY, JSON.stringify(state)).then((ok)=>{
      dataStorageOk = !!ok;
      showSaveFlag(dataStorageOk);
    }).catch(()=>{
      dataStorageOk = false;
      showSaveFlag(false);
    });
  }catch(e){
    dataStorageOk = false;
    showSaveFlag(false);
  }
}

function update(fn){
  fn(state);
  // نعرض التحديث فورًا بصرف النظر عن نجاح الحفظ، حتى تبقى الواجهة
  // مستجيبة دائمًا حتى لو تعذّر التخزين المشترك تمامًا.
  render();
  persist();
}

/* =========================================================
   التحديث التلقائي: يكتشف تعديلات أعضاء الفريق الآخرين ويعرضها
   دون الحاجة لإعادة تحميل الصفحة، مع تفادي إزعاج من يكتب حاليًا
   في أحد الحقول.
   ========================================================= */
let pollTimer = null;
let isSyncing = false;

function isTypingNow(){
  const el = document.activeElement;
  if(!el) return false;
  const tag = el.tagName;
  return tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA';
}

async function pullRemoteState(force){
  if(isSyncing) return false;
  if(!force && isTypingNow()) return false; // لا تقاطع من يكتب حاليًا
  const mode = StorageAdapter.getMode();
  if(mode !== 'cloud' && mode !== 'bridge' && !force) return false;
  isSyncing = true;
  try{
    const raw = await StorageAdapter.get(STATE_KEY);
    if(raw){
      const remote = JSON.parse(raw);
      const remoteRev = remote.rev || 0;
      if(force || remoteRev > lastKnownRev){
        idCounter = remote.idCounter || idCounter;
        state = remote;
        lastKnownRev = remoteRev;
        render();
        isSyncing = false;
        return true;
      }
    }
  }catch(e){ /* تجاهل فشل التحديث التلقائي بصمت، سيُعاد المحاولة لاحقًا */ }
  isSyncing = false;
  return false;
}

function startAutoSync(){
  stopAutoSync();
  pollTimer = setInterval(()=>{ pullRemoteState(false); }, 12000);
}
function stopAutoSync(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
}

function fmt(n){
  n = Number(n)||0;
  return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function relTime(ts){
  const diff = Math.max(0, Date.now() - ts);
  const s = Math.floor(diff/1000);
  if(s < 15) return 'الآن';
  if(s < 60) return 'منذ ' + s + ' ثانية';
  const m = Math.floor(s/60);
  if(m < 60) return 'منذ ' + m + (m===1?' دقيقة':' دقائق');
  const h = Math.floor(m/60);
  if(h < 24) return 'منذ ' + h + (h===1?' ساعة':' ساعات');
  const d = Math.floor(h/24);
  return 'منذ ' + d + (d===1?' يوم':' أيام');
}

function monthStats(key){
  const mo = yearMonths()[key];
  const entries = mo.entries;
  let paid=0, unpaid=0;
  entries.forEach(e=>{
    const amt = Number(e.amount)||0;
    if(e.status === 'سددت') paid += amt; else unpaid += amt;
  });
  const total = paid+unpaid;
  const byEmployee = {};
  state.employees.forEach(emp=> byEmployee[emp] = 0);
  entries.forEach(e=>{
    if(!(e.employee in byEmployee)) byEmployee[e.employee] = 0;
    byEmployee[e.employee] += Number(e.amount)||0;
  });
  const byCategory = {};
  entries.forEach(e=>{
    const code = e.category || '';
    byCategory[code] = (byCategory[code]||0) + (Number(e.amount)||0);
  });
  return {paid, unpaid, total, count: entries.length, byEmployee, byCategory};
}

// المبلغ المرحّل لموظف معيّن من الأشهر السابقة في نفس السنة: مجموع
// (المقدّم المستلم − المصروف) لكل شهر قبل الشهر المحدَّد. يُعاد التصفير
// تلقائيًا في بداية كل سنة (لا ترحيل بين السنوات حاليًا).
function employeeCarryIn(emp, uptoMonthKey){
  let balance = 0;
  for(const mo of MONTHS){
    if(mo.key === uptoMonthKey) break;
    const s = monthStats(mo.key);
    const adv = (yearMonths()[mo.key].advances && yearMonths()[mo.key].advances[emp]) || 0;
    const spent = s.byEmployee[emp] || 0;
    balance += adv - spent;
  }
  return balance;
}

// قائمة موحّدة بملخص كل موظف لشهر معيّن (مصروف/مقدّم/مرحّل/رصيد نهائي)،
// يستخدمها كل من عرض الشهر وتصدير PDF لتفادي ازدواج المنطق.
function employeeMonthBreakdown(key){
  const s = monthStats(key);
  const mo = yearMonths()[key];
  return Object.keys(s.byEmployee).map(emp=>{
    const advance = (mo.advances && mo.advances[emp]) || 0;
    const carryIn = employeeCarryIn(emp, key);
    const spent = s.byEmployee[emp];
    const diff = (advance + carryIn) - spent;
    return {emp, spent, advance, carryIn, diff};
  });
}

function yearStats(){
  let paid=0, unpaid=0, count=0;
  const byEmployee = {};
  const byCategory = {};
  state.employees.forEach(emp=> byEmployee[emp] = {spent:0, advance:0});
  MONTHS.forEach(mo=>{
    const s = monthStats(mo.key);
    paid += s.paid; unpaid += s.unpaid; count += s.count;
    const adv = yearMonths()[mo.key].advances || {};
    Object.keys(s.byEmployee).forEach(emp=>{
      if(!byEmployee[emp]) byEmployee[emp] = {spent:0, advance:0};
      byEmployee[emp].spent += s.byEmployee[emp];
    });
    Object.keys(adv).forEach(emp=>{
      if(!byEmployee[emp]) byEmployee[emp] = {spent:0, advance:0};
      byEmployee[emp].advance += Number(adv[emp])||0;
    });
    Object.keys(s.byCategory).forEach(code=>{
      byCategory[code] = (byCategory[code]||0) + s.byCategory[code];
    });
  });
  return {paid, unpaid, total: paid+unpaid, count, byEmployee, byCategory};
}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* =========================================================
   نوافذ حوار مخصّصة بديلة عن confirm()/alert()/prompt() الأصلية
   من المتصفح — هذه الدوال قد تكون معطّلة أو محجوبة تمامًا داخل
   إطار المعاينة المعزول (iframe) الذي يعرض هذا التطبيق، ما كان
   يجعل كل عمليات الحذف (التي تعتمد على confirm) وإضافة الموظف
   (التي تعتمد على prompt) لا تعمل إطلاقًا بصمت. هذه البدائل مبنية
   بالكامل داخل الصفحة نفسها فتعمل دائمًا بصرف النظر عن بيئة العرض.
   تُعرض في طبقة منفصلة (dialogRoot) حتى تعمل فوق أي نافذة أخرى
   مفتوحة دون أن تُغلقها.
   ========================================================= */
function uiAlert(message){
  return new Promise(resolve=>{
    const root = document.getElementById('dialogRoot');
    root.innerHTML = `
      <div class="modal-overlay top" id="uiaOverlay">
        <div class="modal-box" style="max-width:380px;">
          <div class="modal-body" style="text-align:right;background:#fff;padding-top:20px;">
            <p style="margin:0;font-size:14px;line-height:1.8;color:var(--ink);">${esc(message)}</p>
          </div>
          <div class="modal-foot">
            <button class="primary" id="uiaOk">حسنًا</button>
          </div>
        </div>
      </div>`;
    const finish = ()=>{ root.innerHTML=''; resolve(); };
    document.getElementById('uiaOverlay').onclick = (e)=>{ if(e.target.id==='uiaOverlay') finish(); };
    document.getElementById('uiaOk').onclick = finish;
    document.getElementById('uiaOk').focus();
  });
}

function uiConfirm(message, opts){
  opts = opts || {};
  return new Promise(resolve=>{
    const root = document.getElementById('dialogRoot');
    const confirmText = opts.confirmText || 'تأكيد';
    const cancelText = opts.cancelText || 'إلغاء';
    const danger = !!opts.danger;
    root.innerHTML = `
      <div class="modal-overlay top" id="uicOverlay">
        <div class="modal-box" style="max-width:380px;">
          <div class="modal-body" style="text-align:right;background:#fff;padding-top:20px;">
            <p style="margin:0;font-size:14px;line-height:1.8;color:var(--ink);">${esc(message)}</p>
          </div>
          <div class="modal-foot">
            <button id="uicCancel">${esc(cancelText)}</button>
            <button class="${danger?'danger':'primary'}" id="uicOk">${esc(confirmText)}</button>
          </div>
        </div>
      </div>`;
    const finish = (val)=>{ root.innerHTML=''; resolve(val); };
    document.getElementById('uicOverlay').onclick = (e)=>{ if(e.target.id==='uicOverlay') finish(false); };
    document.getElementById('uicCancel').onclick = ()=> finish(false);
    document.getElementById('uicOk').onclick = ()=> finish(true);
  });
}

function uiPrompt(message, defaultValue){
  return new Promise(resolve=>{
    const root = document.getElementById('dialogRoot');
    root.innerHTML = `
      <div class="modal-overlay top" id="uipOverlay">
        <div class="modal-box" style="max-width:380px;">
          <div class="modal-body" style="text-align:right;background:#fff;padding-top:20px;">
            <p style="margin:0 0 10px;font-size:13px;color:var(--muted);">${esc(message)}</p>
            <input id="uipInput" type="text" style="border:1px solid var(--line);border-radius:7px;padding:9px 11px;width:100%;font-family:inherit;font-size:13.5px;">
          </div>
          <div class="modal-foot">
            <button id="uipCancel">إلغاء</button>
            <button class="primary" id="uipOk">حسنًا</button>
          </div>
        </div>
      </div>`;
    const input = document.getElementById('uipInput');
    input.value = defaultValue || '';
    input.focus();
    const finish = (val)=>{ root.innerHTML=''; resolve(val); };
    document.getElementById('uipOverlay').onclick = (e)=>{ if(e.target.id==='uipOverlay') finish(null); };
    document.getElementById('uipCancel').onclick = ()=> finish(null);
    document.getElementById('uipOk').onclick = ()=> finish(input.value);
    input.addEventListener('keydown', e=>{
      if(e.key==='Enter') finish(input.value);
      if(e.key==='Escape') finish(null);
    });
  });
}

/* =========================================================
   مسح وإرفاق صور الفواتير
   كل صورة تُخزَّن تحت مفتاح مستقل (receipt-<id>) لتفادي تضخّم
   ملف البيانات الرئيسي، وتُضغط قبل الحفظ لتبقى ضمن حدود التخزين.
   تُحفظ أيضًا نسخة في الذاكرة (receiptMemoryCache) حتى تعمل ميزة
   إرفاق الفواتير خلال الجلسة الحالية حتى لو تعذّر التخزين المشترك.
   ========================================================= */
const receiptMemoryCache = {};

function compressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('read failed'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('decode failed'));
      img.onload = ()=>{
        const maxW = 1100;
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0,0,w,h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function openChangePasswordModal(){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box" style="max-width:380px;">
        <div class="modal-head"><strong>تغيير كلمة المرور</strong><button class="icon-btn" id="modalClose">✕</button></div>
        <div class="modal-body" style="text-align:right;">
          <div id="cpError"></div>
          <div class="field"><label>كلمة المرور الحالية</label><input id="cpOld" type="password" style="direction:ltr;text-align:left;"></div>
          <div class="field"><label>كلمة المرور الجديدة</label><input id="cpNew" type="password" style="direction:ltr;text-align:left;"></div>
          <div class="field"><label>تأكيد كلمة المرور الجديدة</label><input id="cpNew2" type="password" style="direction:ltr;text-align:left;"></div>
        </div>
        <div class="modal-foot"><button class="primary" id="cpSave">حفظ</button></div>
      </div>
    </div>`;
  const closeIt = ()=>{ root.innerHTML=''; };
  document.getElementById('modalOverlay').onclick = (e)=>{ if(e.target.id==='modalOverlay') closeIt(); };
  document.getElementById('modalClose').onclick = closeIt;
  document.getElementById('cpSave').onclick = async ()=>{
    const oldPass = document.getElementById('cpOld').value;
    const newPass = document.getElementById('cpNew').value;
    const newPass2 = document.getElementById('cpNew2').value;
    const err = document.getElementById('cpError');
    err.innerHTML = '';
    const users = await loadUsers();
    const me = users.find(u=>u.username===currentUser.username);
    if(!me){ err.innerHTML = '<div class="auth-error">تعذّر العثور على الحساب.</div>'; return; }
    const oldHash = hashPass(oldPass);
    if(oldHash !== me.passHash){ err.innerHTML = '<div class="auth-error">كلمة المرور الحالية غير صحيحة.</div>'; return; }
    if(newPass.length < 6){ err.innerHTML = '<div class="auth-error">كلمة المرور الجديدة 6 أحرف على الأقل.</div>'; return; }
    if(newPass !== newPass2){ err.innerHTML = '<div class="auth-error">كلمتا المرور غير متطابقتين.</div>'; return; }
    me.passHash = hashPass(newPass);
    const ok = await persistUsers(users);
    closeIt();
    await uiAlert(ok
      ? 'تم تحديث كلمة المرور بنجاح.'
      : 'تم تحديث كلمة المرور لهذه الجلسة، لكن تعذّر حفظها بشكل دائم — ستعود لكلمة المرور السابقة عند إعادة التحميل.');
  };
}

/* =========================================================
   إعداد المزامنة السحابية (رابط Google Apps Script Web App)
   ========================================================= */
async function openCloudSyncModal(){
  const root = document.getElementById('modalRoot');
  const currentUrl = StorageAdapter.getCloudUrl();
  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box" style="max-width:520px;">
        <div class="modal-head"><strong>المزامنة السحابية</strong><button class="icon-btn" id="modalClose">✕</button></div>
        <div class="modal-body" style="text-align:right;background:#fff;">
          <p style="font-size:12.5px;color:var(--muted);line-height:1.9;margin-top:0;">
            بعد نشر رابط "Google Apps Script Web App" الخاص بمؤسستكم (راجع تعليمات النشر التي أرسلها لك المساعد)، الصقه هنا. عندها ستُحفظ كل بيانات هذا التطبيق — المصروفات والمستخدمين والفواتير — في حساب Google الخاص بكم، وتظهر تلقائيًا لأي شخص يفتح هذا الملف على أي جهاز.
          </p>
          <div id="csError"></div>
          <div class="field"><label>رابط المزامنة (Web App URL)</label>
            <input id="csUrl" type="text" placeholder="https://script.google.com/macros/s/AKfycb.../exec" value="${esc(currentUrl)}" style="direction:ltr;text-align:left;font-family:'IBM Plex Mono',monospace;font-size:12px;">
          </div>
        </div>
        <div class="modal-foot">
          <button class="danger" id="csClear">إلغاء الربط</button>
          <button id="csTest">اختبار الاتصال</button>
          <button class="primary" id="csSave">حفظ والمزامنة الآن</button>
        </div>
      </div>
    </div>`;
  const closeIt = ()=>{ root.innerHTML=''; };
  document.getElementById('modalOverlay').onclick = (e)=>{ if(e.target.id==='modalOverlay') closeIt(); };
  document.getElementById('modalClose').onclick = closeIt;

  document.getElementById('csTest').onclick = async ()=>{
    const url = document.getElementById('csUrl').value.trim();
    const err = document.getElementById('csError');
    err.innerHTML = '<div class="security-note">جارِ الاختبار…</div>';
    if(!url){ err.innerHTML = '<div class="auth-error">أدخل الرابط أولًا.</div>'; return; }
    StorageAdapter.setCloudUrl(url);
    const ok = await StorageAdapter.cloudPing();
    err.innerHTML = ok
      ? '<div class="security-note" style="color:var(--ok);">✔ الاتصال ناجح — الرابط يعمل بشكل صحيح.</div>'
      : '<div class="auth-error">تعذّر الاتصال بهذا الرابط. تأكد أنه رابط "Web App" منشور بصلاحية "Anyone" وأنك نسخته كاملًا.</div>';
  };

  document.getElementById('csSave').onclick = async ()=>{
    const url = document.getElementById('csUrl').value.trim();
    const err = document.getElementById('csError');
    err.innerHTML = '<div class="security-note">جارِ الحفظ والمزامنة…</div>';
    StorageAdapter.setCloudUrl(url);
    if(url){
      const ok = await StorageAdapter.cloudPing();
      if(!ok){
        err.innerHTML = '<div class="auth-error">تعذّر الاتصال بهذا الرابط، لم يُحفظ. تحقق منه وحاول مجددًا.</div>';
        StorageAdapter.setCloudUrl('');
        return;
      }
    }
    await StorageAdapter.probe();
    // ادفع نسخة العمل الحالية إلى السحابة فورًا حتى لا تُفقد أي بيانات محلية سابقة
    if(url){
      state.idCounter = idCounter;
      await StorageAdapter.set(STATE_KEY, JSON.stringify(state));
      await StorageAdapter.set(USERS_KEY, JSON.stringify(usersCache || await loadUsers(true)));
    }
    closeIt();
    renderShellRefreshOnly();
    await uiAlert(url ? 'تم ربط المزامنة السحابية ورفع بياناتك الحالية إليها.' : 'تم إلغاء ربط المزامنة السحابية.');
  };

  document.getElementById('csClear').onclick = async ()=>{
    if(!(await uiConfirm('إلغاء ربط المزامنة السحابية؟ ستعود البيانات للحفظ المحلي في هذا المتصفح فقط.', {danger:true, confirmText:'إلغاء الربط'}))) return;
    StorageAdapter.setCloudUrl('');
    await StorageAdapter.probe();
    closeIt();
    renderShellRefreshOnly();
  };
}

/* =========================================================
   بحث شامل عبر كل عمليات السنة
   ========================================================= */
function openSearchModal(){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box" style="max-width:680px;">
        <div class="modal-head"><strong>بحث في كل عمليات السنة</strong><button class="icon-btn" id="modalClose">✕</button></div>
        <div class="modal-body" style="text-align:right;background:#fff;">
          <input id="searchInput" type="text" placeholder="ابحث بالمورّد، رقم الفاتورة، التفاصيل، الملاحظات، أو الموظف…" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:inherit;font-size:13.5px;" autofocus>
          <div id="searchResults" style="margin-top:14px;"><div class="empty-note">اكتب كلمة للبحث في كل الأشهر.</div></div>
        </div>
      </div>
    </div>`;
  const closeIt = ()=>{ root.innerHTML=''; };
  document.getElementById('modalOverlay').onclick = (e)=>{ if(e.target.id==='modalOverlay') closeIt(); };
  document.getElementById('modalClose').onclick = closeIt;

  const input = document.getElementById('searchInput');
  const resultsBox = document.getElementById('searchResults');

  function runSearch(){
    const q = input.value.trim().toLowerCase();
    if(!q){ resultsBox.innerHTML = '<div class="empty-note">اكتب كلمة للبحث في كل الأشهر.</div>'; return; }
    const matches = [];
    MONTHS.forEach(mo=>{
      yearMonths()[mo.key].entries.forEach(e=>{
        const hay = [e.vendor, e.invoice, e.details, e.notes, e.employee, e.category, categoryName(e.category)].join(' ').toLowerCase();
        if(hay.includes(q)) matches.push({mo, e});
      });
    });
    if(!matches.length){ resultsBox.innerHTML = '<div class="empty-note">لا توجد نتائج مطابقة.</div>'; return; }
    resultsBox.innerHTML = `
      <table>
        <thead><tr><th>الشهر</th><th class="num">التاريخ</th><th>المورّد</th><th>التفاصيل</th><th class="col-amount num">المبلغ</th><th>الموظف</th><th></th></tr></thead>
        <tbody>
          ${matches.slice(0,100).map(({mo,e})=>`
            <tr>
              <td>${monthName(mo)}</td>
              <td class="num">${esc(e.date)}</td>
              <td>${esc(e.vendor)}</td>
              <td>${esc(e.details)}</td>
              <td class="num">${fmt(e.amount)}</td>
              <td>${esc(e.employee)}</td>
              <td><button class="ghost sm" data-jump="${mo.key}">فتح</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      ${matches.length>100 ? `<div class="empty-note">وعدد ${matches.length-100} نتيجة أخرى — دقّق كلمة البحث لتضييق النتائج.</div>` : ''}
    `;
    resultsBox.querySelectorAll('[data-jump]').forEach(btn=>{
      btn.onclick = ()=>{ activeTab = btn.dataset.jump; closeIt(); render(); };
    });
  }
  let searchDebounce = null;
  input.addEventListener('input', ()=>{ clearTimeout(searchDebounce); searchDebounce = setTimeout(runSearch, 200); });
  input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ clearTimeout(searchDebounce); runSearch(); } });
}

/* =========================================================

function logActivity(action, detail){
  if(!state.auditLog) state.auditLog = [];
  state.auditLog.unshift({
    ts: Date.now(),
    user: currentUser ? currentUser.displayName : '—',
    action,
    detail: detail || ''
  });
  if(state.auditLog.length > 200) state.auditLog.length = 200;
}

    }
    wrap.innerHTML = `
      <table class="users-table">
        <thead><tr><th>الاسم</th><th></th></tr></thead>

          ${state.employees.map(emp=>`
            <tr>
              <td>${esc(emp)}</td>

            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
    wrap.querySelectorAll('[data-del-emp]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const name = btn.dataset.delEmp;
        const ok = await uiConfirm('حذف الموظف "'+name+'"؟ العمليات المسجَّلة باسمه سابقًا تبقى كما هي ولن تُحذف.', {danger:true, confirmText:'حذف'});
        if(!ok) return;
        update(st=>{ st.employees = st.employees.filter(e=>e!==name); });
        refreshList();
      });
    });

  document.getElementById('empAdd').onclick = ()=>{
    const input = document.getElementById('empNewName');

    const err = document.getElementById('empError');
    err.innerHTML = '';

    input.value = '';
    refreshList();
  };
  document.getElementById('empNewName').addEventListener('keydown', e=>{
    if(e.key==='Enter') document.getElementById('empAdd').click();
  });
}

   إدارة تصنيفات المصروفات (دليل الحسابات)

async function openCategoriesModal(){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box" style="max-width:560px;">
        <div class="modal-head"><strong>${t('manageCategories')}</strong><button class="icon-btn" id="modalClose">✕</button></div>
        <div class="modal-body" style="text-align:right;background:#fff;">
          <div id="catError"></div>
          <div id="catListWrap"><div class="loading" style="padding:20px;">…</div></div>
          <div class="inline-form" style="grid-template-columns:110px 1fr auto;">
            <input id="catNewCode" type="text" placeholder="${t('categoryCode')}" style="border:1px solid var(--line);border-radius:7px;padding:9px 11px;font-family:'IBM Plex Mono',monospace;direction:ltr;text-align:left;">
            <input id="catNewName" type="text" placeholder="${t('categoryName')}" style="border:1px solid var(--line);border-radius:7px;padding:9px 11px;font-family:inherit;">
            <button class="primary" id="catAdd">${currentLang==='en'?'Add':'إضافة'}</button>
          </div>
        </div>
      </div>
    </div>`;
  const closeIt = ()=>{ root.innerHTML=''; };
  document.getElementById('modalOverlay').onclick = (e)=>{ if(e.target.id==='modalOverlay') closeIt(); };
  document.getElementById('modalClose').onclick = closeIt;

  function refreshList(){
    const wrap = document.getElementById('catListWrap');
    const cats = state.categories || [];
    if(!cats.length){
      wrap.innerHTML = `<div class="empty-note">${currentLang==='en'?'No categories yet.':'لا يوجد تصنيفات بعد.'}</div>`;
      return;
    }
    wrap.innerHTML = `
      <table class="users-table">
        <thead><tr><th class="num">${t('categoryCode')}</th><th>${t('categoryName')}</th><th></th></tr></thead>
        <tbody>
          ${cats.slice().sort((a,b)=>a.code.localeCompare(b.code)).map(c=>`
            <tr>
              <td class="num">${esc(c.code)}</td>
              <td>${esc(categoryName(c.code))}</td>
              <td><button class="icon-btn" data-del-cat="${esc(c.code)}" title="${t('delete')}">✕</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
    wrap.querySelectorAll('[data-del-cat]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const code = btn.dataset.delCat;
        const ok = await uiConfirm(
          currentLang==='en'
            ? `Delete category "${code}"? Entries already using it keep the code, but it will show as an unknown category.`
            : `حذف التصنيف "${code}"؟ العمليات المسجَّلة به سابقًا تبقى كما هي وسيظهر رمزها فقط دون اسم.`,
          {danger:true, confirmText:t('delete')}
        );
        if(!ok) return;
        update(st=>{ st.categories = st.categories.filter(c=>c.code!==code); });
        refreshList();
      });
    });
  }
  refreshList();

  document.getElementById('catAdd').onclick = ()=>{
    const codeInput = document.getElementById('catNewCode');
    const nameInput = document.getElementById('catNewName');
    const code = codeInput.value.trim();
    const name = nameInput.value.trim();
    const err = document.getElementById('catError');
    err.innerHTML = '';
    if(!code || !name){ err.innerHTML = `<div class="auth-error">${currentLang==='en'?'Enter both a code and a name.':'أدخل الرمز والاسم معًا.'}</div>`; return; }
    if((state.categories||[]).some(c=>c.code===code)){ err.innerHTML = `<div class="auth-error">${currentLang==='en'?'This code already exists.':'هذا الرمز موجود بالفعل.'}</div>`; return; }
    update(st=>{
      if(!st.categories) st.categories = [];
      st.categories.push({code, nameAr: name, nameEn: name});
      logActivity('إضافة تصنيف', code+' - '+name);
    });
    codeInput.value=''; nameInput.value='';
    refreshList();
  };
  document.getElementById('catNewName').addEventListener('keydown', e=>{
    if(e.key==='Enter') document.getElementById('catAdd').click();
  });
}

        <div class="modal-body" style="text-align:right;background:#fff;">

            <button class="primary" id="nuAdd">إضافة</button>
          </div>
        </div>
      </div>
    </div>`;
  const closeIt = ()=>{ root.innerHTML=''; };
  document.getElementById('modalOverlay').onclick = (e)=>{ if(e.target.id==='modalOverlay') closeIt(); };
  document.getElementById('modalClose').onclick = closeIt;

  function showStorageNote(){
    const note = document.getElementById('usersStorageNote');
    if(!note) return;
    note.innerHTML = storageOk ? '' :
      '<div class="auth-error">تنبيه: التخزين المشترك لا يعمل في هذا العرض — أي مستخدم تضيفه الآن سيعمل لهذه الجلسة فقط، وسيختفي عند إعادة تحميل الصفحة.</div>';
  }

  async function refreshList(){
    const users = await loadUsers();
    showStorageNote();
    const wrap = document.getElementById('usersListWrap');
    const adminCount = users.filter(u=>u.role==='admin').length;
    wrap.innerHTML = `
      <table class="users-table">
        <thead><tr><th>الاسم</th><th>اسم المستخدم</th><th>الصلاحية</th><th></th></tr></thead>
        <tbody>
          ${users.map(u=>`
            <tr data-u="${esc(u.username)}">
              <td>${esc(u.displayName)}</td>
              <td class="num">${esc(u.username)}</td>
              <td>
                <select data-role-for="${esc(u.username)}" ${u.username===currentUser.username && adminCount<=1 ? 'disabled' : ''}>
                  <option value="member" ${u.role==='member'?'selected':''}>موظف</option>
                  <option value="admin" ${u.role==='admin'?'selected':''}>مدير</option>
                </select>
              </td>
              <td><button class="icon-btn" data-del="${esc(u.username)}" title="حذف المستخدم">✕</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
    wrap.querySelectorAll('[data-role-for]').forEach(sel=>{
      sel.addEventListener('change', async ()=>{
        const uname = sel.dataset.roleFor;
        const list = await loadUsers();
        const u = list.find(x=>x.username===uname);
        if(u){ u.role = sel.value; await persistUsers(list); }
        if(uname === currentUser.username) currentUser.role = sel.value;
        refreshList();
        renderShellRefreshOnly();
      });
    });
    wrap.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const uname = btn.dataset.del;
        if(uname === currentUser.username){ await uiAlert('لا يمكنك حذف حسابك الحالي وأنت مسجّل الدخول به.'); return; }
        const list = await loadUsers();
        const target = list.find(x=>x.username===uname);
        const admins = list.filter(x=>x.role==='admin');
        if(target && target.role==='admin' && admins.length<=1){ await uiAlert('لا يمكن حذف آخر حساب مدير.'); return; }
        if(!(await uiConfirm('حذف المستخدم "'+uname+'"؟', {danger:true, confirmText:'حذف'}))) return;
        const updated = list.filter(x=>x.username!==uname);
        await persistUsers(updated);
        refreshList();
      });
    });
  }
  await refreshList();

  document.getElementById('nuAdd').onclick = async ()=>{
    const name = document.getElementById('nuName').value.trim();
    const uname = document.getElementById('nuUser').value.trim().toLowerCase();
    const pass = document.getElementById('nuPass').value;
    const role = document.getElementById('nuRole').value;
    const err = document.getElementById('usersError');
    err.innerHTML = '';
    if(!name || !uname || !pass){ err.innerHTML = '<div class="auth-error">الرجاء تعبئة جميع الحقول.</div>'; return; }
    if(pass.length < 6){ err.innerHTML = '<div class="auth-error">كلمة المرور 6 أحرف على الأقل.</div>'; return; }
    const list = await loadUsers();
    if(list.some(u=>u.username===uname)){ err.innerHTML = '<div class="auth-error">اسم المستخدم مستخدم بالفعل.</div>'; return; }
    const passHash = hashPass(pass);
    list.push({username: uname, displayName: name, role, passHash});
    const ok = await persistUsers(list);
    document.getElementById('nuName').value='';
    document.getElementById('nuUser').value='';
    document.getElementById('nuPass').value='';
    if(!ok){
      err.innerHTML = '<div class="auth-error">أُضيف المستخدم لهذه الجلسة فقط — تعذّر الحفظ الدائم (التخزين المشترك لا يعمل هنا).</div>';
    }
    refreshList();
  };
}

// استعادة نسخة احتياطية سبق تنزيلها بـ exportJson(). هذا هو الحل العملي
// لاستمرارية العمل عندما لا يعمل التخزين المشترك التلقائي: نزّل نسخة قبل
// إغلاق الصفحة، واستوردها عند فتحها من جديد.
function importJson(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      // يدعم كل من نسخ الاستيراد القديمة (months على الجذر لسنة واحدة)
      // والجديدة (years لعدّة سنوات)
      if(parsed && typeof parsed === 'object' && parsed.months && !parsed.years){
        parsed.years = { '2026': { months: parsed.months } };
        delete parsed.months;
      }
      if(!parsed || typeof parsed !== 'object' || !parsed.years || !parsed.employees){
        await uiAlert('هذا الملف لا يبدو نسخة احتياطية صالحة لهذا التطبيق.');
        return;
      }
      let totalEntries = 0;
      Object.keys(parsed.years).forEach(y=>{
        MONTHS.forEach(mo=>{
          const m = parsed.years[y].months && parsed.years[y].months[mo.key];
          if(m && m.entries) totalEntries += m.entries.length;
        });
      });
      const proceed = await uiConfirm(`سيتم استبدال كل البيانات الحالية في الشاشة بمحتوى الملف المستورد (${totalEntries} عملية عبر ${Object.keys(parsed.years).length} سنة). هل تريد المتابعة؟`, {danger:true, confirmText:'استيراد واستبدال'});
      if(!proceed){
        input.value = '';
        return;
      }
      idCounter = parsed.idCounter || 1000;
      if(!parsed.categories || !parsed.categories.length){
        parsed.categories = DEFAULT_CATEGORIES.map(c=>({...c}));
      }
      state = parsed;
      const yks = yearKeysSorted();
      activeYear = yks[yks.length-1] || '2026';
      ensureYearExists(state, activeYear);
      persist();
      render();
      await uiAlert('تم استيراد النسخة الاحتياطية بنجاح.');
    }catch(err){
      await uiAlert('تعذّر قراءة هذا الملف. تأكد أنه ملف JSON صحيح تم تنزيله من هذا التطبيق.');
    }
    input.value = '';
  };
  reader.onerror = async ()=>{ await uiAlert('تعذّر قراءة الملف.'); input.value=''; };
  reader.readAsText(file);
}

function exportMonthCsv(key){
  const mo = yearMonths()[key];
  const moDef = MONTHS.find(m=>m.key===key);
  const name = monthName(moDef);
  let rows = [[t('colNum'),t('colStatus'),t('colDate'),t('colInvoice'),t('colVendor'),t('colDetails'),t('colAmount'),t('colEmployee'),t('colCategory'),t('colNotes')]];
  mo.entries.forEach((e,i)=> rows.push([i+1, e.status==='سددت'?t('statusPaid'):t('statusUnpaid'), e.date,e.invoice,e.vendor,e.details,e.amount,e.employee,categoryLabel(e.category),e.notes]));
  const csv = '\uFEFF'+rows.map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${currentLang==='en'?'expenses':'مصروفات'}_${name}_${activeYear}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportMonthPdf(key){

  const catTotalsRowsHtml = catCodes.map(code=>`

  const preparedLabel = currentLang==='en' ? 'Prepared by' : 'المعدّ';
  const approvedLabel = currentLang==='en' ? 'Approved by' : 'المعتمد';
  const noDataLabel = currentLang==='en' ? 'No entries recorded for this month.' : 'لا توجد عمليات مسجَّلة لهذا الشهر.';
  const printHintLabel = currentLang==='en'
    ? 'Use your browser\'s Print (Ctrl/Cmd+P) and choose "Save as PDF" as the destination.'
    : 'استخدم أمر الطباعة في متصفحك (Ctrl+P أو Cmd+P) واختر «حفظ كـ PDF» كوجهة.';

  const reportBody = `
    <div class="pr-header">
      <img src="data:image/png;base64,${LOGO_B64}" alt="${esc(t('orgName'))}">
