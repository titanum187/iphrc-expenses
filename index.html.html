  `;

  // نبني مستندًا مستقلاً بالكامل ونفتحه في تبويب جديد بدل استدعاء
  // window.print() على الصفحة الحالية مباشرة — لأن إطار المعاينة المعزول
  // الذي يعرض هذا التطبيق يحجب نافذة الطباعة تمامًا (بلا أي رسالة خطأ)،
  // تمامًا كما كان يحجب confirm/alert سابقًا. تبويب منفصل حقيقي في المتصفح
  // لا يخضع لهذا الحجب، ويمكن دائمًا طباعته أو حفظه كـ PDF يدويًا.
  const fullHtml = `<!DOCTYPE html>
<html lang="${currentLang==='en'?'en':'ar'}" dir="${currentLang==='en'?'ltr':'rtl'}">
<head>
<meta charset="UTF-8">
<title>${esc(reportTitle)}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{font-family:'Cairo',sans-serif;margin:0;padding:24px;color:#0D2621;background:#fff;}
  .pr-print-hint{
    background:#DEF1EA;color:#045847;border:1px solid #0E9077;border-radius:8px;
    padding:10px 14px;margin-bottom:18px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .pr-print-hint button{
    background:#06755C;color:#fff;border:none;border-radius:6px;padding:8px 16px;
    font-family:inherit;font-size:13px;cursor:pointer;flex:none;
  }
  .pr-header{display:flex;align-items:center;gap:14px;border-bottom:3px solid #06755C;padding-bottom:12px;margin-bottom:16px;}
  .pr-header img{width:56px;height:56px;flex:none;}
  .pr-header .pr-org{font-size:12px;color:#5C7069;font-weight:600;margin-bottom:3px;}
  .pr-header h1{margin:0;font-size:21px;color:#06755C;}
  .pr-header .pr-meta{font-size:12px;color:#5C7069;margin-top:3px;}
  .pr-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px;max-width:340px;}
  .pr-stat{border:1px solid #D6E7E1;border-radius:6px;padding:8px 10px;}
  .pr-stat .pr-label{font-size:11px;color:#5C7069;font-weight:700;margin-bottom:3px;}
  .pr-stat .pr-value{font-size:17px;font-weight:800;color:#06755C;font-family:'IBM Plex Mono',monospace;}
  .pr-section-title{font-size:14.5px;font-weight:800;color:#06755C;margin:18px 0 8px;border-inline-start:4px solid #06755C;padding-inline-start:8px;}
  .pr-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:6px;border-radius:6px;overflow:hidden;box-shadow:0 1px 3px rgba(13,38,33,.08);}
  .pr-table th{background:#06755C;color:#fff;padding:7px 6px;text-align:center;font-size:11.5px;font-weight:700;letter-spacing:.2px;}
  .pr-table td{padding:6px 6px;border-bottom:1px solid #D6E7E1;text-align:center;vertical-align:middle;}
  .pr-table tr:nth-child(even) td{background:#F1F8F5;}
  .pr-table tfoot td{font-weight:800;border-top:2px solid #06755C;background:#fff;text-align:center;}
  .pr-num{font-family:'IBM Plex Mono',monospace;text-align:center !important;direction:ltr;unicode-bidi:plaintext;}
  .pr-footer{margin-top:24px;padding-top:10px;border-top:1px solid #D6E7E1;font-size:11px;color:#5C7069;}
  .pr-signatures{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:34px;}
  .pr-sign-line{border-top:1px solid #0D2621;padding-top:6px;font-size:12px;color:#5C7069;}
  @media print{
    .pr-print-hint{display:none;}
    @page{ size:A4; margin:14mm; }
    * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
  }
</style>
</head>
<body>
  <div class="pr-print-hint">
    <span>${esc(printHintLabel)}</span>
    <button onclick="window.print()">🖨️ ${currentLang==='en'?'Print / Save PDF':'طباعة / حفظ PDF'}</button>
  </div>
  ${reportBody}
</body>
</html>`;

  const win = window.open('', '_blank');
  if(!win){
    uiAlert(currentLang==='en'
      ? 'Could not open a new tab. Please allow pop-ups for this site in your browser, then try again.'
      : 'تعذّر فتح تبويب جديد. اسمح بالنوافذ المنبثقة (Pop-ups) لهذا الموقع من إعدادات متصفحك، ثم حاول مجددًا.');
    return;
  }
  win.document.open();
  win.document.write(fullHtml);
  win.document.close();
}

/* =========================================================
   صفحة الملخص
   ========================================================= */
function renderSummary(){
  const y = yearStats();
  let html = `
    <div class="grid-4">
      <div class="stat"><div class="label">${t('totalExpenses')}</div><div class="value num">${fmt(y.total)}</div></div>
      <div class="stat ok"><div class="label">${t('paid')}</div><div class="value num">${fmt(y.paid)}</div></div>
      <div class="stat bad"><div class="label">${t('unpaid')}</div><div class="value num">${fmt(y.unpaid)}</div></div>
      <div class="stat gold"><div class="label">${t('entryCount')}</div><div class="value num">${y.count}</div></div>
    </div>

    <div class="panel">
      <h2>${t('monthlyTotals')} <span class="hint">${t('clickToOpen')}</span></h2>
      <div class="month-grid">
        ${(()=>{
          const maxTotal = Math.max(1, ...MONTHS.map(mo=>monthStats(mo.key).total));
          return MONTHS.map(mo=>{
            const s = monthStats(mo.key);
            const barPct = Math.round((s.total / maxTotal) * 100);
            return `<div class="month-card" data-month="${mo.key}">
              <div class="m-name">${monthName(mo)}</div>
              <div class="m-total num" style="color:${s.total>0?'var(--teal)':'var(--muted)'}">${fmt(s.total)}</div>
              <div class="m-bar-track"><div class="m-bar-fill" style="width:${s.total>0?Math.max(barPct,4):0}%;"></div></div>
              <div class="m-count">${s.count} ${t('operations')}${s.count?` · ${t('paid')} ${fmt(s.paid)}`:''}</div>
            </div>`;
          }).join('');
        })()}
      </div>
    </div>

    <div class="panel">
      <h2>${t('annualByEmployee')}</h2>
      <table class="emp-table">
        <thead><tr><th>${t('employee')}</th><th class="num">${t('annualSpent')}</th><th class="num">${t('annualAdvance')}</th><th class="num">${t('diffAdvSpend')}</th></tr></thead>
        <tbody>
          ${Object.keys(y.byEmployee).map(emp=>{
            const d = y.byEmployee[emp];
            const diff = d.advance - d.spent;
            return `<tr>
              <td data-label="${t('employee')}">${esc(emp)}</td>
              <td class="num" data-label="${t('annualSpent')}">${fmt(d.spent)}</td>
              <td class="num" data-label="${t('annualAdvance')}">${fmt(d.advance)}</td>
              <td class="num ${diff>=0?'diff-pos':'diff-neg'}" data-label="${t('diffAdvSpend')}">${fmt(diff)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>

    <div class="panel">
      <h2>${t('categoryTotalsTitle')} — ${activeYear}</h2>
      ${(()=>{
        const codes = Object.keys(y.byCategory).sort((a,b)=> a==='' ? 1 : b==='' ? -1 : a.localeCompare(b));
        if(!codes.length) return `<div class="empty-note">${t('emptyMonth')}</div>`;
        return `<table class="emp-table">
          <thead><tr><th class="num">${t('categoryCode')}</th><th>${t('categoryName')}</th><th class="num">${t('annualSpent')}</th></tr></thead>
          <tbody>
            ${codes.map(code=>`<tr>
              <td class="num" data-label="${t('categoryCode')}">${code || '—'}</td>
              <td data-label="${t('categoryName')}">${esc(categoryName(code))}</td>
              <td class="num" data-label="${t('annualSpent')}">${fmt(y.byCategory[code])}</td>
            </tr>`).join('')}
          </tbody>
        </table>`;
      })()}
    </div>
  `;
  renderShell(html);
  document.querySelectorAll('.month-card').forEach(c=>{
    c.onclick = ()=>{ activeTab = c.dataset.month; render(); };
  });
}

/* =========================================================
   صفحة الشهر
   ========================================================= */
function renderMonth(key){
  const moDef = MONTHS.find(m=>m.key===key);
  const mo = yearMonths()[key];
  const s = monthStats(key);

  const rowsHtml = mo.entries.map((e,i)=>`
    <tr data-id="${e.id}">
      <td class="col-num" data-label="${t('colNum')}">${i+1}</td>
      <td class="col-status" data-label="${t('colStatus')}">
        <button class="badge ${e.status==='سددت'?'paid':'unpaid'}" data-act="toggle-status">${e.status==='سددت'?t('statusPaid'):t('statusUnpaid')}</button>
      </td>
      <td class="col-date" data-label="${t('colDate')}"><input class="cell-input" type="date" data-field="date" value="${esc(e.date)}"></td>
      <td data-label="${t('colInvoice')}"><input class="cell-input" type="text" data-field="invoice" value="${esc(e.invoice)}" placeholder="${t('colInvoice')}" title="${esc(e.invoice)}"></td>
      <td data-label="${t('colVendor')}"><input class="cell-input" type="text" data-field="vendor" value="${esc(e.vendor)}" placeholder="${t('colVendor')}" title="${esc(e.vendor)}"></td>
      <td data-label="${t('colDetails')}"><textarea class="cell-input auto-grow" data-field="details" placeholder="${t('colDetails')}" title="${esc(e.details)}" rows="1">${esc(e.details)}</textarea></td>
      <td class="col-amount" data-label="${t('colAmount')}"><input class="cell-input" type="number" step="0.01" data-field="amount" value="${e.amount}"></td>
      <td data-label="${t('colEmployee')}">
        <select class="cell-input" data-field="employee">
          ${state.employees.map(emp=>`<option value="${esc(emp)}" ${emp===e.employee?'selected':''}>${esc(emp)}</option>`).join('')}
        </select>
      </td>
      <td data-label="${t('colCategory')}">
        <select class="cell-input" data-field="category" style="min-width:120px;">
          <option value="" ${!e.category?'selected':''}>${t('uncategorized')}</option>
          ${(state.categories||[]).map(c=>`<option value="${esc(c.code)}" ${c.code===e.category?'selected':''}>${esc(categoryLabel(c.code))}</option>`).join('')}
        </select>
      </td>
      <td data-label="${t('colNotes')}"><input class="cell-input" type="text" data-field="notes" value="${esc(e.notes)}" placeholder="—" title="${esc(e.notes)}"></td>
      <td class="col-receipt" data-label="${t('colReceipt')}">
        <button class="receipt-btn ${e.hasReceipt?'has-file':''}" data-act="receipt" title="${e.hasReceipt?(currentLang==='en'?'View invoice image':'عرض صورة الفاتورة'):(currentLang==='en'?'Attach / scan invoice':'إرفاق / تصوير الفاتورة')}">${e.hasReceipt?'🧾':'📎'}</button>
        <input type="file" accept="image/*" data-file-for="${e.id}" style="display:none;">
        <input type="file" accept="image/*" capture="environment" data-camera-for="${e.id}" style="display:none;">
      </td>
      <td class="row-actions" data-label="">${isAdmin() ? `<button class="icon-btn" data-act="delete" title="${currentLang==='en'?'Delete row':'حذف الصف'}">✕</button>` : ''}</td>
    </tr>
  `).join('');

  const empRows = employeeMonthBreakdown(key).map(({emp,spent,advance,carryIn,diff})=>{
    return `<tr>
      <td data-label="${t('employee')}">${esc(emp)}</td>
      <td class="num" data-label="${t('totalSpend')}">${fmt(spent)}</td>
      <td data-label="${t('advanceThisMonth')}"><input class="cell-input num" type="number" step="0.01" data-adv-emp="${esc(emp)}" value="${advance}" style="text-align:left;direction:ltr;background:#EAF6F0;border:1px solid var(--gold-soft);border-radius:5px;"></td>
      <td class="num ${carryIn>=0?'diff-pos':'diff-neg'}" data-label="${t('carriedOver')}">${fmt(carryIn)}</td>
      <td class="num ${diff>=0?'diff-pos':'diff-neg'}" style="font-weight:800;" data-label="${t('finalBalance')}">${fmt(diff)}</td>
    </tr>`;
  }).join('');

  let html = `
    <div class="grid-4">
      <div class="stat"><div class="label">${t('totalExpenses')} — ${monthName(moDef)}</div><div class="value num">${fmt(s.total)}</div></div>
      <div class="stat ok"><div class="label">${t('paid')}</div><div class="value num">${fmt(s.paid)}</div></div>
      <div class="stat bad"><div class="label">${t('unpaid')}</div><div class="value num">${fmt(s.unpaid)}</div></div>
      <div class="stat gold"><div class="label">${t('entryCount')}</div><div class="value num">${s.count}</div></div>
    </div>

    <div class="panel">
      <h2>${t('monthExpenseLog')} ${monthName(moDef)}
        <span>
          <button class="ghost sm" id="btnCsv">${t('exportCsv')}</button>
          <button class="ghost sm" id="btnPdf">${t('exportPdf')}</button>
        </span>
      </h2>
      ${mo.entries.length ? `
      <div class="table-scroll">
      <table>
        <thead><tr>
          <th class="col-num">${t('colNum')}</th><th class="col-status">${t('colStatus')}</th><th class="col-date num">${t('colDate')}</th>
          <th>${t('colInvoice')}</th><th>${t('colVendor')}</th><th>${t('colDetails')}</th><th class="col-amount num">${t('colAmount')}</th>
          <th>${t('colEmployee')}</th><th>${t('colCategory')}</th><th>${t('colNotes')}</th><th class="col-receipt">${t('colReceipt')}</th><th></th>
        </tr></thead>
        <tbody id="rowsBody">${rowsHtml}</tbody>
        <tfoot><tr><td colspan="6">${t('total')}</td><td class="num">${fmt(s.total)}</td><td colspan="5"></td></tr></tfoot>
      </table>
      </div>` : `<div class="empty-note">${t('emptyMonth')}</div>`}
      <div class="add-row-bar"><button class="primary" id="btnAddRow">${t('addEntry')}</button></div>
    </div>

    <div class="panel">
      <h2>${t('empSummaryTitle')} <span class="hint">${t('empSummaryHint')}</span></h2>
      <table class="emp-table">
        <thead><tr><th>${t('employee')}</th><th class="num">${t('totalSpend')}</th><th class="num">${t('advanceThisMonth')}</th><th class="num">${t('carriedOver')}</th><th class="num">${t('finalBalance')}</th></tr></thead>
        <tbody>${empRows}</tbody>
      </table>
    </div>

    <div class="panel">
      <h2>${t('categoryTotalsTitle')} — ${monthName(moDef)}</h2>
      ${(()=>{
        const codes = Object.keys(s.byCategory).sort((a,b)=> a==='' ? 1 : b==='' ? -1 : a.localeCompare(b));
        if(!codes.length) return `<div class="empty-note">${t('emptyMonth')}</div>`;
        return `<table class="emp-table">
          <thead><tr><th class="num">${t('categoryCode')}</th><th>${t('categoryName')}</th><th class="num">${t('totalSpend')}</th></tr></thead>
          <tbody>
            ${codes.map(code=>`<tr>
              <td class="num" data-label="${t('categoryCode')}">${code || '—'}</td>
              <td data-label="${t('categoryName')}">${esc(categoryName(code))}</td>
              <td class="num" data-label="${t('totalSpend')}">${fmt(s.byCategory[code])}</td>
            </tr>`).join('')}
          </tbody>
        </table>`;
      })()}
    </div>
  `;

  renderShell(html);

  document.getElementById('btnAddRow').onclick = ()=>{
    update(st=>{
      yearMonths()[key].entries.push(mkEntry('لم تسدد', new Date().toISOString().slice(0,10), '', '', '', 0, st.employees[0]||''));
      logActivity('إضافة عملية', moDef.name);
    });
  };
  document.getElementById('btnCsv').onclick = ()=> exportMonthCsv(key);
  document.getElementById('btnPdf').onclick = ()=> exportMonthPdf(key);

  document.querySelectorAll('#rowsBody tr').forEach(tr=>{
    const id = tr.dataset.id;
    tr.querySelectorAll('[data-field]').forEach(input=>{
      const field = input.dataset.field;
      const isTypedField = (input.tagName === 'INPUT' && (input.type==='text' || input.type==='number')) || input.tagName === 'TEXTAREA';
      if(isTypedField){
        // أثناء الكتابة: نحدّث البيانات فورًا في الذاكرة بصمت (بلا إعادة رسم
        // ولا حفظ لكل ضغطة) حتى لا يفقد الحقل التركيز ولا يُرسل حفظ متكرر
        // مزعج على كل حرف. الحفظ الفعلي وإعادة الرسم يحدثان عند مغادرة
        // الحقل (blur) أو بعد توقف قصير عن الكتابة.
        if(input.tagName === 'TEXTAREA') autoGrowTextarea(input);
        input.addEventListener('input', ()=>{
          const entry = yearMonths()[key].entries.find(e=>e.id===id);
          if(!entry) return;
          entry[field] = field==='amount' ? (parseFloat(input.value)||0) : input.value;
          if(field!=='amount') input.title = input.value;
          if(input.tagName === 'TEXTAREA') autoGrowTextarea(input);
          scheduleSilentSave();
        });
        input.addEventListener('blur', ()=>{ commitEditsNow(); });
        input.addEventListener('keydown', e=>{
          if(e.key==='Enter'){ e.preventDefault(); input.blur(); }
        });
      } else {
        const evt = (input.tagName==='SELECT' || input.type==='date') ? 'change' : 'input';
        input.addEventListener(evt, ()=>{
          update(st=>{
            const entry = yearMonths()[key].entries.find(e=>e.id===id);
            if(!entry) return;
            entry[field] = input.value;
          });
        });
      }
    });
    const statusBtn = tr.querySelector('[data-act="toggle-status"]');
    if(statusBtn) statusBtn.onclick = ()=>{
      update(st=>{
        const entry = yearMonths()[key].entries.find(e=>e.id===id);
        entry.status = entry.status==='سددت' ? 'لم تسدد' : 'سددت';
      });
    };
    const delBtn = tr.querySelector('[data-act="delete"]');
    if(delBtn) delBtn.onclick = async ()=>{
      if(!isAdmin()){ await uiAlert('حذف العمليات متاح للمدير فقط.'); return; }
      if(await uiConfirm('حذف هذا الصف؟', {danger:true, confirmText:'حذف'})){
        deleteReceipt(id);
        update(st=>{ yearMonths()[key].entries = yearMonths()[key].entries.filter(e=>e.id!==id); });
      }
    };

    const fileInput = tr.querySelector('[data-file-for]');
    const cameraInput = tr.querySelector('[data-camera-for]');
    const receiptBtn = tr.querySelector('[data-act="receipt"]');
    if(receiptBtn){
      receiptBtn.onclick = ()=>{
        const entry = yearMonths()[key].entries.find(e=>e.id===id);
        if(entry && entry.hasReceipt){ openReceiptModal(key, id); }
        else { openAttachChoiceModal(fileInput, cameraInput); }
      };
    }
    const handleFile = async (input)=>{
      const file = input.files[0];
      if(!file) return;
      receiptBtn.classList.add('loading');
      try{
        const dataUrl = await compressImage(file);
        // نحفظ في ذاكرة الجلسة فورًا كي تعمل الميزة حتى لو تعذّر التخزين
        // المشترك، ثم نحاول الحفظ الدائم بشكل منفصل
        receiptMemoryCache[id] = dataUrl;
        update(st=>{
          const entry = yearMonths()[key].entries.find(e=>e.id===id);
          if(entry) entry.hasReceipt = true;
        });
        try{
          const saved = await StorageAdapter.set('receipt-'+id, dataUrl);
          if(!saved){
            await uiAlert('تم إرفاق الصورة لهذه الجلسة فقط — تعذّر حفظها بشكل دائم.');
          }
        }catch(storageErr){
          await uiAlert('تم إرفاق الصورة لهذه الجلسة فقط — تعذّر حفظها بشكل دائم.');
        }
      }catch(err){
        await uiAlert('تعذّر قراءة الصورة، حاول مجددًا.');
      }
      receiptBtn.classList.remove('loading');
      input.value = '';
    };
    if(fileInput) fileInput.onchange = ()=> handleFile(fileInput);
    if(cameraInput) cameraInput.onchange = ()=> handleFile(cameraInput);
  });

  document.querySelectorAll('[data-adv-emp]').forEach(input=>{
    input.addEventListener('input', ()=>{
      if(!yearMonths()[key].advances) yearMonths()[key].advances = {};
      yearMonths()[key].advances[input.dataset.advEmp] = parseFloat(input.value)||0;
      scheduleSilentSave();
    });
    input.addEventListener('blur', ()=>{ commitEditsNow(); });
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') input.blur(); });
  });
}

/* =========================================================
   نقطة الدخول
   ========================================================= */
function render(){
  if(activeTab==='SUMMARY') renderSummary();
  else renderMonth(activeTab);
}

async function startApp(){
  document.getElementById('app').innerHTML = '<div class="loading">جارِ تحميل البيانات…</div>';
  state = await loadState();
  render();
  startAutoSync();
}

async function boot(){
  document.getElementById('app').innerHTML = '<div class="loading">جارِ التحقق من الجلسة…</div>';
  await StorageAdapter.probe();
  const users = await loadUsers();
  renderLogin(users);
}

document.addEventListener('click', (e)=>{
  const menu = document.getElementById('accountMenu');
  const chip = document.getElementById('accountChip');
  if(menu && menu.style.display!=='none' && chip && !e.composedPath().includes(chip)){
    menu.style.display = 'none';
  }
});

boot();
</script>
</body>
</html>
